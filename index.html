<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFEFF3;
    --glow1: #FFD2DF;
    --glow2: #FFEBBF;
    --ink: #3A1236;
    --muted: #7A4A6E;
    --paper: #FFFBFC;
    --rose: #E8527A;
    --rose2: #C73A63;
    --gold: #E9B44C;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1D0B1F; --glow1: #4A1740; --glow2: #3B2A12;
      --ink: #FFE8EE; --muted: #D9A9C2; --paper: #2B1230;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(circle at 18% 12%, var(--glow1) 0, transparent 45%),
      radial-gradient(circle at 85% 88%, var(--glow2) 0, transparent 42%),
      var(--bg);
    color: var(--ink);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* ---------- MÀN NHẬP TÊN ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; padding: 20px;
    transition: opacity .6s ease, transform .6s ease;
  }
  .gate.hide { opacity: 0; transform: scale(1.05); pointer-events: none; }
  .gate-box { width: min(340px, 100%); text-align: center; }
  .gate-flower { width: 84px; height: 84px; animation: spin 24s linear infinite; filter: drop-shadow(0 6px 10px rgba(200,60,100,.3)); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gate h2 {
    font-family: "Dancing Script", cursive; font-weight: 700;
    font-size: 2.3rem; line-height: 1.15; margin: .5rem 0 .3rem; color: var(--rose2);
  }
  .gate p { margin: 0 0 1.3rem; color: var(--muted); font-size: .95rem; }
  .gate input {
    width: 100%; padding: .85rem 1.1rem; text-align: center;
    border: 2px solid transparent; border-radius: 2rem;
    background: var(--paper); color: var(--ink);
    font: inherit; font-size: 1.05rem;
    box-shadow: 0 6px 20px rgba(200, 60, 100, .16);
    transition: border-color .2s, box-shadow .2s;
  }
  .gate input:focus { outline: none; border-color: var(--rose); box-shadow: 0 6px 24px rgba(200, 60, 100, .3); }
  .gate input.shake { animation: shake .4s; border-color: var(--rose2); }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .go {
    margin-top: .9rem; min-height: 48px; padding: .8rem 2rem;
    border: 0; border-radius: 2rem; cursor: pointer;
    background: linear-gradient(135deg, var(--rose), var(--rose2));
    color: #fff; font: inherit; font-weight: 600; font-size: 1rem;
    box-shadow: 0 8px 20px rgba(200, 60, 100, .35);
    transition: transform .15s, box-shadow .2s;
  }
  .go:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(200, 60, 100, .4); }
  .go:active { transform: scale(.97); }

  /* ---------- THIỆP ---------- */
  .card {
    --w: min(88vw, 360px, 60vh);
    width: var(--w); height: calc(var(--w) * 4 / 3);
    font-size: calc(var(--w) / 22);
    position: relative; perspective: 1600px;
    opacity: 0; visibility: hidden; pointer-events: none;
  }
  .card.show { opacity: 1; visibility: visible; pointer-events: auto; }
  .card.show:not(.open) { animation: bob 4s 1s ease-in-out infinite; }
  .card.show.intro:not(.open) {
    animation: rise .9s cubic-bezier(.2, .8, .2, 1) both, bob 4s 1s ease-in-out infinite;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes bob { 50% { transform: translateY(-5px); } }

  .inside {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 100% 0, rgba(233, 180, 76, .18), transparent 40%),
      radial-gradient(circle at 0 100%, rgba(232, 82, 122, .12), transparent 45%),
      var(--paper);
    border-radius: .4em .9em .9em .4em;
    box-shadow: 0 1.2em 2.4em rgba(120, 20, 60, .28);
    padding: 2em 1.8em 1.6em;
    display: flex; flex-direction: column; gap: .9em;
  }
  .inside > * { opacity: 0; transform: translateY(10px); transition: opacity .6s ease, transform .6s ease; }
  .card.open .inside > * { opacity: 1; transform: none; }
  .card.open .inside > :nth-child(1) { transition-delay: .7s; }
  .card.open .inside > :nth-child(2) { transition-delay: .9s; }
  .card.open .inside > :nth-child(3) { transition-delay: 1.1s; }
  .card.open .inside > :nth-child(4) { transition-delay: 1.3s; }
  .card.open .inside > :nth-child(5) { transition-delay: 1.5s; }

  h1 { font-family: "Dancing Script", cursive; font-size: 2.1em; margin: 0; color: var(--rose2); font-weight: 700; }

  .to {
    font-family: "Dancing Script", cursive; font-weight: 700;
    font-size: 1.9em; line-height: 1.2; margin: 0; color: var(--ink);
    align-self: flex-start; max-width: 100%; position: relative; overflow-wrap: anywhere;
  }
  .to::after {
    content: ""; position: absolute; left: 0; bottom: -.08em; height: 2px; width: 100%;
    background: linear-gradient(90deg, var(--rose), var(--gold));
    transform: scaleX(0); transform-origin: left; transition: transform 1s 1.6s ease;
  }
  .card.open .to::after { transform: scaleX(1); }

  .msg { line-height: 1.65; margin: 0; flex: 1; min-height: 6em; }
  .sign { margin: 0; text-align: right; font-family: "Dancing Script", cursive; font-weight: 700; font-size: 1.5em; color: var(--rose2); overflow-wrap: anywhere; }
  .sign[hidden] { display: none; }

  .btn {
    align-self: flex-start; border: 0; border-radius: 2em;
    background: var(--rose); color: #fff; font: inherit; font-weight: 500;
    padding: .7em 1.3em; cursor: pointer; min-height: 44px;
    transition: background .2s, transform .1s;
  }
  .actions { display: flex; flex-wrap: wrap; gap: .6em; align-self: flex-start; }
  .btn.ghost { background: transparent; color: var(--rose2); box-shadow: inset 0 0 0 1.5px var(--rose); }
  .btn.ghost:hover { background: var(--rose); color: #fff; }
  .btn:hover { background: var(--rose2); }
  .btn:active { transform: scale(.97); }
  input:focus-visible, .btn:focus-visible, .cover:focus-visible, .go:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* Bìa */
  .cover {
    position: absolute; inset: 0;
    transform-origin: left center; transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(.6, .05, .2, 1);
    cursor: pointer; z-index: 2;
  }
  .cover:hover { transform: rotateY(-10deg); }
  .card.open .cover { transform: rotateY(-168deg); cursor: default; }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: .4em .9em .9em .4em;
  }
  .front {
    background: linear-gradient(160deg, #F0678C, var(--rose) 45%, var(--rose2));
    color: #FFF6F8; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5em;
    box-shadow: 0 1.2em 2.4em rgba(120, 20, 60, .35);
    border-left: .5em solid var(--rose2);
  }
  .front::after { /* vệt sáng lướt qua */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .3) 50%, transparent 60%);
    transform: translateX(-100%); animation: sheen 4.5s ease-in-out infinite; pointer-events: none;
  }
  @keyframes sheen { 0%, 55% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .back { background: var(--paper); transform: rotateY(180deg); border-right: .5em solid rgba(232, 82, 122, .25); box-shadow: inset 1em 0 2em rgba(0, 0, 0, .1); }

  .front svg { width: 50%; height: auto; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .18)); animation: spin 30s linear infinite; }
  .num { font-family: "Dancing Script", cursive; font-size: 3.4em; line-height: 1; margin: 0; }
  .for { margin: 0; font-size: 1.05em; opacity: .95; padding: 0 1em; text-align: center; overflow-wrap: anywhere; }
  .hint { font-size: .8em; margin: .3em 0 0; opacity: .85; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  .spark { position: absolute; color: #FFE7A8; animation: twinkle 2.4s ease-in-out infinite; pointer-events: none; }
  @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }

  /* Cánh hoa rơi */
  .petal { position: fixed; top: -20px; border-radius: 70% 0 70% 0; pointer-events: none; z-index: 5; animation: fall linear forwards; }
  @keyframes fall {
    0% { opacity: .9; transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(calc(var(--dx) * .7), 55vh) rotate(270deg); }
    100% { opacity: .2; transform: translate(var(--dx), 110vh) rotate(540deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01s !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>


<div class="gate" id="gate">
  <form class="gate-box" id="gateForm" autocomplete="off">
    <svg class="gate-flower" viewBox="0 0 200 200" aria-hidden="true">
      <g transform="translate(100 100)" fill="#F7A1B8">
        <ellipse rx="22" ry="52" cy="-52"/>
        <ellipse rx="22" ry="52" cy="-52" transform="rotate(60)"/>
        <ellipse rx="22" ry="52" cy="-52" transform="rotate(120)"/>
        <ellipse rx="22" ry="52" cy="-52" transform="rotate(180)"/>
        <ellipse rx="22" ry="52" cy="-52" transform="rotate(240)"/>
        <ellipse rx="22" ry="52" cy="-52" transform="rotate(300)"/>
        <circle r="20" fill="#E9B44C"/>
      </g>
    </svg>
    <h2> Tấm thiệp này dành cho bạn🫰 </h2>
    <p>Nhập tên để mở thiệp nha</p>
    <label for="name" hidden>Tên của bạn</label>
    <input id="name" maxlength="30" placeholder="Tên của bạn..." enterkeyhint="go">
    <button class="go" type="submit">Mở thiệp</button>
  </form>
</div>

<!-- Thiệp -->
<main class="card" id="card">
  <section class="inside" aria-label="Nội dung thiệp">
    <h1>Chúc mừng ngày Phụ Nữ Việt Nam 20/10💕 </h1>
    <p class="to" id="toName"></p>
    <p class="msg" id="msg"></p>
    <div class="actions">
      <button class="btn" id="more" type="button">Thêm lời chúc...</button>
      <button class="btn ghost" id="close" type="button">Đóng thiệp</button>
    </div>
    <p class="sign" id="sign" hidden></p>
  </section>

  <div class="cover" id="cover" role="button" tabindex="0" aria-label="Mở thiệp">
    <div class="face front">
      <span class="spark" style="top:12%;left:14%;font-size:1.2em">✦</span>
      <span class="spark" style="top:20%;right:12%;font-size:.8em;animation-delay:.8s">✦</span>
      <span class="spark" style="bottom:22%;left:10%;font-size:.9em;animation-delay:1.4s">✦</span>
      <span class="spark" style="bottom:12%;right:16%;font-size:1.1em;animation-delay:.4s">✦</span>
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <g transform="translate(100 100)" fill="#FFC9D6">
          <ellipse rx="22" ry="52" cy="-52"/>
          <ellipse rx="22" ry="52" cy="-52" transform="rotate(60)"/>
          <ellipse rx="22" ry="52" cy="-52" transform="rotate(120)"/>
          <ellipse rx="22" ry="52" cy="-52" transform="rotate(180)"/>
          <ellipse rx="22" ry="52" cy="-52" transform="rotate(240)"/>
          <ellipse rx="22" ry="52" cy="-52" transform="rotate(300)"/>
          <circle r="20" fill="#E9B44C"/>
        </g>
      </svg>
      <p class="num">20/10</p>
      <p class="for" id="coverFor"></p>
      <p class="hint">Chạm để mở thiệp nhaa</p>
    </div>
    <div class="face back"></div>
  </div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var gate = $('gate'), form = $('gateForm'), nameIn = $('name'),
      card = $('card'), cover = $('cover'), msg = $('msg'), more = $('more'),
      toName = $('toName'), coverFor = $('coverFor'), sign = $('sign');

  var name = '', i = 0, timer = null;
  var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var colors = ['#E8527A', '#F7A1B8', '#FFC9D6', '#E9B44C'];


  var wishes = [
    "Chúc {name} ngày 20/10 thật vui vẻ nha 🌷, hạnh phúc và gặp được nhiều điều may mắn nha💕",
    "Một ngày thật nhẹ nhàng, vui tươi: ngủ đủ giấc, ăn những món ăn mình thích 😻",
    "Mong rằng mỗi ngày trôi qua đều mang đến cho {name} niềm vui, những nụ cười chân thành và thật nhiều yêu thương.",
    "Chúc {name} luôn rạng rỡ như ánh nắng ban mai, dịu dàng nhưng mạnh mẽ, tự tin theo đuổi những ước mơ của mình nhaa💐",
  ];

  
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('to')) nameIn.value = q.get('to').slice(0, 30);
    if (q.get('from')) {
      sign.textContent = '— ' + q.get('from').slice(0, 30);
      sign.hidden = false;
    }
  } catch (e) {}

  function petals(n) {
    if (calm) return;
    for (var k = 0; k < n; k++) {
      var p = document.createElement('i');
      p.className = 'petal';
      var size = Math.random() * 8 + 10;
      p.style.width = size + 'px';
      p.style.height = (size * 1.3) + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      p.style.animationDuration = (4.5 + Math.random() * 3.5) + 's';
      p.style.animationDelay = (Math.random() * 1.2) + 's';
      p.style.background = colors[k % colors.length];
      p.addEventListener('animationend', function () { this.remove(); });
      document.body.appendChild(p);
    }
  }

  function type(text) {
    clearInterval(timer);
    if (calm) { msg.textContent = text; return; }
    msg.textContent = '';
    var n = 0;
    timer = setInterval(function () {
      n++;
      msg.textContent = text.slice(0, n);
      if (n >= text.length) clearInterval(timer);
    }, 22);
  }
  function wish() { return wishes[i].replace(/\{name\}/g, name); }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = nameIn.value.trim();
    if (!v) {
      nameIn.classList.remove('shake');
      void nameIn.offsetWidth;
      nameIn.classList.add('shake');
      nameIn.placeholder = 'Bạn nhập tên trước nha';
      nameIn.focus();
      return;
    }
    name = v;
    toName.textContent = 'Gửi ' + name + ',';
    coverFor.textContent = 'Dành cho ' + name;
    gate.classList.add('hide');
    setTimeout(function () { gate.style.display = 'none'; }, 650);
    card.classList.add('show', 'intro');
    cover.focus({ preventScroll: true });
    petals(12);
  });

  var openTimer = null;

  function open() {
    if (card.classList.contains('open')) return;
    card.classList.remove('intro');
    card.classList.add('open');
    cover.setAttribute('aria-label', 'Thiệp đã mở');
    cover.removeAttribute('tabindex');
    petals(40);
    openTimer = setTimeout(function () { type(wish()); }, 1500);
  }

  function closeCard() {
    if (!card.classList.contains('open')) return;
    clearTimeout(openTimer);
    clearInterval(timer);
    card.classList.remove('open');
    msg.textContent = '';
    cover.setAttribute('aria-label', 'Mở thiệp');
    cover.setAttribute('tabindex', '0');
    cover.focus({ preventScroll: true });
    petals(8);
  }
  $('close').addEventListener('click', closeCard);
  cover.addEventListener('click', open);
  cover.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });

  more.addEventListener('click', function () {
    i = (i + 1) % wishes.length;
    type(wish());
    petals(15);
  });

  petals(10); 
  nameIn.focus();
})();
</script>

</body>
</html>
